{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Website{% endblock %}</title>
    
    <!-- CSS yahan link ho rahi hai -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header>
        <h2>My Django Site</h2>
        <nav>
            <a href="/home/">Home</a> | 
            <a href="/about/">About</a> | 
            <a href="/books/">Books</a> |

            <!-- Login / Logout logic -->
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}!</span> |
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="cursor: pointer;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>
    <hr>

    <main>
        <!-- Baaki pages (home, about, login) ka content yahan aayega -->
        {% block content %}
        {% endblock %}
    </main>

    <hr>
    <footer>
        <p>© 2026 MyWebsite. All rights reserved.</p>
    </footer>
</body>
</html>
